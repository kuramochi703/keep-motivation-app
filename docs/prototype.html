<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>サボると、やつれる。</title>
<style>
  :root{
    --bg:#EEF1F5;--surface:#FFFFFF;--ink:#0F141A;--muted:#69737F;--line:#E2E7ED;--danger:#E0533D;
    --h:158;--s:62;
    --accent:hsl(var(--h) calc(var(--s) * 1%) 42%);
    --accent-soft:hsl(var(--h) calc(var(--s) * 1%) 95%);
    --font:system-ui,-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Yu Gothic",Meiryo,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1000px;margin:0 auto;padding:44px 20px 72px}
  header{margin-bottom:28px}
  h1{font-size:clamp(26px,4.4vw,36px);font-weight:700;letter-spacing:-.02em;line-height:1.3;margin:0 0 8px}
  header p{margin:0;color:var(--muted);max-width:36em;font-size:14px}
  .grid{display:grid;gap:20px}
  @media(min-width:860px){.grid{grid-template-columns:minmax(0,44%) minmax(0,1fr);gap:24px;align-items:start}}
  .card{background:var(--surface);border-radius:22px;padding:22px}
  .stage{position:relative;overflow:hidden;box-shadow:0 24px 48px -28px hsl(var(--h) 40% 30% / .45);transition:box-shadow .8s ease}
  .stage::before{content:"";position:absolute;inset:-40% -20% auto;height:78%;
    background:radial-gradient(60% 100% at 50% 50%, var(--accent-soft), transparent 70%);transition:background .8s ease}
  .badge{position:relative;display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;
    padding:5px 11px;border-radius:99px;background:var(--accent-soft);color:var(--accent);transition:.6s ease}
  .badge i{width:6px;height:6px;border-radius:50%;background:currentColor}
  .avatar{position:relative;display:block;width:100%;max-width:300px;margin:2px auto 0}
  .speech{position:relative;text-align:center;font-size:16px;font-weight:600;margin:0 0 18px;min-height:1.7em}
  .meter .row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px}
  .meter .row span{font-size:13px;color:var(--muted);font-weight:500}
  .meter .row b{font-size:26px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
  .meter .row b small{font-size:13px;font-weight:500;color:var(--muted);margin-left:2px}
  .gauge{height:8px;border-radius:99px;background:#E7EBF0;overflow:hidden}
  .gauge i{display:block;height:100%;border-radius:99px;background:var(--accent);width:0;
    transition:width .55s cubic-bezier(.2,.8,.3,1),background .6s ease}
  .forecast{position:relative;margin:14px 0 0;font-size:13px;color:var(--muted);text-align:center}
  .forecast.warn{color:var(--danger);font-weight:600}

  .goal{display:flex;align-items:center;gap:8px;margin-bottom:2px}
  .goal input{flex:1;min-width:0;font:inherit;font-size:17px;font-weight:700;letter-spacing:-.01em;color:inherit;
    border:none;background:none;padding:4px 6px;border-radius:8px;margin-left:-6px}
  .goal input:hover{background:#F5F7FA}
  .goal input:focus{outline:none;background:#fff;box-shadow:0 0 0 2px var(--accent)}
  .sub{margin:0 0 20px;font-size:13px;color:var(--muted)}

  .timer{display:flex;align-items:center;gap:22px;flex-wrap:wrap;justify-content:center;text-align:center}
  .ring{position:relative;width:150px;height:150px;flex:0 0 auto}
  .ring svg{width:100%;height:100%;transform:rotate(-90deg)}
  .ring .track{fill:none;stroke:#E7EBF0;stroke-width:9}
  .ring .prog{fill:none;stroke:var(--accent);stroke-width:9;stroke-linecap:round;
    transition:stroke-dashoffset 1s linear,stroke .6s ease}
  .ring .num{position:absolute;inset:0;display:grid;place-content:center;font-size:30px;font-weight:700;
    letter-spacing:-.03em;font-variant-numeric:tabular-nums}
  .ring .num em{display:block;font-style:normal;font-size:11px;font-weight:500;color:var(--muted);letter-spacing:0;margin-top:-4px}
  .acts{display:flex;flex-direction:column;gap:10px;min-width:190px;flex:1}
  .btn{font:inherit;font-weight:600;cursor:pointer;border-radius:13px;padding:13px 18px;border:1px solid transparent;
    background:var(--accent);color:#fff;transition:.18s;font-size:15px}
  .btn:hover{filter:brightness(1.08)}
  .btn.sec{background:#F2F5F8;color:var(--ink);border-color:var(--line);font-weight:500;font-size:14px;padding:11px 16px}
  .btn.sec:hover{filter:none;background:#E9EDF2}
  .btn.ghost{background:none;color:var(--muted);border-color:var(--line);font-weight:500;padding:8px 14px;font-size:13px}
  .btn:disabled{opacity:.45;cursor:default;filter:none}
  .btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .donemsg{background:var(--accent-soft);color:var(--accent);border-radius:13px;padding:13px 16px;font-weight:600;font-size:14.5px}

  .stats{display:flex;gap:8px;margin-top:24px}
  .stats div{flex:1;background:#F5F7FA;border-radius:14px;padding:12px 14px}
  .stats b{display:block;font-size:22px;font-weight:700;letter-spacing:-.03em;line-height:1.25;font-variant-numeric:tabular-nums}
  .stats span{font-size:12px;color:var(--muted)}

  .cal{margin-top:24px}
  .cal h3{font-size:13px;font-weight:600;color:var(--muted);margin:0 0 10px}
  .cells{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;max-width:280px}
  .cells i{aspect-ratio:1;border-radius:6px;background:#E7EBF0;display:block}
  .cells i.on{background:var(--accent)}
  .cells i.today{box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--ink)}

  footer{margin-top:22px;padding-top:16px;border-top:1px solid var(--line)}
  footer p{margin:0 0 12px;font-size:12.5px;color:var(--muted)}
  .tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .preview{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:12.5px;color:var(--muted)}
  .preview input[type=range]{flex:1;min-width:120px;accent-color:var(--accent)}

  .avatar{--skin:#F2C4A5;--cloth:#34A98A;--hair:#2F3A45;--edge:#1A2028;--gold:#F0B429}
  .lv4{--skin:#F7CBAA;--cloth:#0FB07E;--hair:#2B3440}
  .lv3{--skin:#F2C4A5;--cloth:#34A98A;--hair:#2F3A45}
  .lv2{--skin:#DEC1AC;--cloth:#8098A4;--hair:#3B454E;--gold:#C9B98A}
  .lv1{--skin:#CBB5A6;--cloth:#98A3AB;--hair:#4A535A;--gold:#B4AE9C}
  .lv0{--skin:#B5ACA6;--cloth:#8C9298;--hair:#575E63;--gold:#A8A5A0}
  .avatar [data-show]{display:none}
  .lv4 [data-show~="4"],.lv3 [data-show~="3"],.lv2 [data-show~="2"],
  .lv1 [data-show~="1"],.lv0 [data-show~="0"]{display:inline}
  .figure{transition:transform .7s ease}
  .lv1 .figure{transform:translateY(5px) rotate(-2deg)}
  .lv0 .figure{transform:translateY(9px) rotate(-4deg)}
  .sparkle{animation:tw 2.6s ease-in-out infinite}
  .sparkle:nth-of-type(2){animation-delay:.9s}
  .sparkle:nth-of-type(3){animation-delay:1.7s}
  @keyframes tw{0%,100%{opacity:.2;transform:scale(.72)}50%{opacity:1;transform:scale(1)}}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="wrap">
  <header>
    <h1>サボると、やつれる。</h1>
    <p>やることを細かく決めなくていい。1日5分でも机に向かえば、その日は達成。手を止めた日数だけ、アバターは痩せていく。</p>
  </header>

  <div class="grid">
    <section class="card stage" id="stage">
      <span class="badge"><i></i><span id="levelName">元気</span></span>
      <svg class="avatar lv3" id="avatar" viewBox="0 0 240 250" role="img" aria-labelledby="avatarLabel">
        <title id="avatarLabel">アバターの状態</title>
        <g fill="var(--gold)" data-show="4">
          <path class="sparkle" d="M46 70l4 10 10 4-10 4-4 10-4-10-10-4 10-4z"/>
          <path class="sparkle" d="M196 96l3 8 8 3-8 3-3 8-3-8-8-3 8-3z"/>
          <path class="sparkle" d="M180 40l3 7 7 3-7 3-3 7-3-7-7-3 7-3z"/>
        </g>
        <g data-show="0" stroke="#9CA3AA" fill="none" stroke-width="2" stroke-linecap="round">
          <path d="M182 86q8-8 16-2M186 96q9-6 16 1"/>
          <circle cx="196" cy="72" r="3" fill="#7E858B" stroke="none"/>
          <path d="M192 68q-6-4-9 0M200 68q6-4 9 0"/>
        </g>
        <ellipse cx="120" cy="236" rx="56" ry="8" fill="#0F141A" opacity=".08"/>
        <g class="figure">
          <path data-show="4" d="M86 152l-30 74q64 11 128 0l-30-74z" fill="var(--gold)" opacity=".9"/>
          <rect x="98" y="198" width="15" height="34" rx="7" fill="var(--skin)"/>
          <rect x="127" y="198" width="15" height="34" rx="7" fill="var(--skin)"/>
          <path data-show="4 3 2 1" d="M84 152q36-15 72 0l10 56H74z" fill="var(--cloth)"/>
          <path data-show="0" d="M84 152q36-15 72 0l10 56-13-9-10 11-12-10-11 10-13-11-11 9-13-10z" fill="var(--cloth)"/>
          <g data-show="1 0">
            <rect x="128" y="170" width="24" height="21" rx="3" fill="#A7ADB3" transform="rotate(8 140 180)"/>
            <path d="M128 178h26M140 168v24" stroke="#7C838A" stroke-width="1.4" transform="rotate(8 140 180)"/>
          </g>
          <path d="M86 158q-16 16-14 40" stroke="var(--skin)" stroke-width="14" stroke-linecap="round" fill="none"/>
          <path d="M154 158q16 16 14 40" stroke="var(--skin)" stroke-width="14" stroke-linecap="round" fill="none"/>
          <rect x="110" y="132" width="20" height="20" fill="var(--skin)"/>
          <circle cx="120" cy="104" r="38" fill="var(--skin)"/>
          <path d="M82 96q6-44 38-44t38 44q-14-20-38-20t-38 20z" fill="var(--hair)"/>
          <path data-show="4" d="M97 54l-3-20 12 9 8-15 8 15 12-9-3 20z" fill="var(--gold)"/>
          <g data-show="4 3 2">
            <circle cx="106" cy="105" r="5" fill="var(--edge)"/>
            <circle cx="134" cy="105" r="5" fill="var(--edge)"/>
            <circle data-show="4" cx="108" cy="103" r="1.8" fill="#fff"/>
            <circle data-show="4" cx="136" cy="103" r="1.8" fill="#fff"/>
          </g>
          <g data-show="1 0" stroke="var(--edge)" stroke-width="3" fill="none" stroke-linecap="round">
            <path d="M100 108q6-7 12 0M128 108q6-7 12 0"/>
          </g>
          <path data-show="4 3" d="M109 120q11 12 22 0" stroke="var(--edge)" stroke-width="3" fill="none" stroke-linecap="round"/>
          <path data-show="2" d="M111 124h18" stroke="var(--edge)" stroke-width="3" fill="none" stroke-linecap="round"/>
          <path data-show="1 0" d="M109 128q11-10 22 0" stroke="var(--edge)" stroke-width="3" fill="none" stroke-linecap="round"/>
          <path data-show="1" d="M162 96q6 9 6 13a6 6 0 01-12 0q0-4 6-13z" fill="#5FA8D3"/>
        </g>
      </svg>
      <p class="speech" id="speech"></p>
      <div class="meter">
        <div class="row"><span>活力</span><b id="vitalNum">0<small>/100</small></b></div>
        <div class="gauge"><i id="bar"></i></div>
      </div>
      <p class="forecast" id="forecast"></p>
    </section>

    <section class="card">
      <div class="goal"><input id="goal" maxlength="30" aria-label="勉強していること" placeholder="勉強していること"></div>
      <p class="sub" id="dateLabel"></p>

      <div class="timer">
        <div class="ring">
          <svg viewBox="0 0 120 120">
            <circle class="track" cx="60" cy="60" r="52"/>
            <circle class="prog" id="prog" cx="60" cy="60" r="52" stroke-dasharray="326.7" stroke-dashoffset="0"/>
          </svg>
          <div class="num"><span id="clock">5:00</span><em id="clockNote">最低ライン</em></div>
        </div>
        <div class="acts" id="acts"></div>
      </div>

      <div class="stats">
        <div><b id="streak">0</b><span>連続日数</span></div>
        <div><b id="best">0</b><span>最長記録</span></div>
        <div><b id="total">0</b><span>のべ日数</span></div>
      </div>

      <div class="cal">
        <h3 id="calTitle">この5週間</h3>
        <div class="cells" id="cells"></div>
      </div>

      <footer>
        <p>やった日は活力+12、やらなかった日は-20。1日サボると、取り戻すのに2日かかる。</p>
        <div class="tools">
          <button class="btn ghost" id="nextDay">翌日にする（お試し）</button>
          <button class="btn ghost" id="reset">最初から</button>
        </div>
        <label class="preview">見た目をためす
          <input type="range" id="peek" min="0" max="100" value="62" aria-label="活力を動かして見た目を確認">
        </label>
      </footer>
    </section>
  </div>
</div>

<script>
const KEY='yatsure:state:v3', GAIN=12, DECAY=20, SESSION=300;
const LEVELS=[
  {min:0,  lv:0,name:'ボロボロ',  say:'もう、うごけない…',     h:212,s:8},
  {min:20, lv:1,name:'しょんぼり',say:'ちょっとしんどいかも。', h:208,s:16},
  {min:45, lv:2,name:'ふつう',    say:'ふつう。ここからだよ。', h:190,s:28},
  {min:70, lv:3,name:'元気',      say:'調子いいね。',           h:166,s:52},
  {min:90, lv:4,name:'絶好調',    say:'絶好調。今日もいける。', h:156,s:68}
];
let state={vitality:62,goal:'資格の勉強',lastDate:null,dayOffset:0,done:[],best:0};
let peek=null,left=SESSION,timer=null;

const clamp=v=>Math.max(0,Math.min(100,Math.round(v)));
const today=()=>{const d=new Date();d.setDate(d.getDate()+state.dayOffset);return d;};
const key=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const shift=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x;};
const isDone=d=>state.done.includes(key(d));

async function save(){try{await window.storage.set(KEY,JSON.stringify(state),false);}catch(e){}}
async function load(){try{const r=await window.storage.get(KEY,false);if(r&&r.value)state=Object.assign(state,JSON.parse(r.value));}catch(e){}}

function rollover(){
  const t=today(), tk=key(t);
  if(!state.lastDate){state.lastDate=tk;return;}
  if(state.lastDate===tk)return;
  let d=new Date(state.lastDate.split('-').map((v,i)=>i===1?v-1:+v).reduce((a,b)=>a,0)) ;
  const [y,m,dd]=state.lastDate.split('-').map(Number);
  d=new Date(y,m-1,dd);
  while(key(d)!==tk){
    if(!isDone(d)) state.vitality=clamp(state.vitality-DECAY);
    d=shift(d,1);
  }
  state.lastDate=tk;
}

function streak(){
  let n=0,d=today();
  if(!isDone(d)) d=shift(d,-1);
  while(isDone(d)){n++;d=shift(d,-1);}
  return n;
}

function markDone(){
  const tk=key(today());
  if(state.done.includes(tk))return;
  state.done.push(tk);
  state.vitality=clamp(state.vitality+GAIN);
  state.best=Math.max(state.best,streak());
  peek=null;document.getElementById('peek').value=state.vitality;
  render();save();
}

function fmt(s){return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}
function tick(){
  left--;
  if(left<=0){stop();left=SESSION;markDone();paintTimer();return;}
  paintTimer();
}
function start(){if(timer)return;timer=setInterval(tick,1000);renderActs();paintTimer();}
function stop(){clearInterval(timer);timer=null;renderActs();}
function paintTimer(){
  document.getElementById('clock').textContent=fmt(left);
  document.getElementById('prog').style.strokeDashoffset=(326.7*(1-left/SESSION)).toFixed(1);
  document.getElementById('clockNote').textContent=timer?'集中中':'最低ライン';
}

function renderActs(){
  const a=document.getElementById('acts');a.innerHTML='';
  if(isDone(today())){
    const d=document.createElement('div');d.className='donemsg';
    d.textContent='今日はもう積んだ。あとは自由時間。';a.appendChild(d);
    const more=document.createElement('button');more.className='btn sec';
    more.textContent=timer?'タイマーを止める':'もう5分やる';
    more.onclick=()=>timer?stop():start();a.appendChild(more);
    return;
  }
  const b=document.createElement('button');b.className='btn';
  b.textContent=timer?'一時停止':(left<SESSION?'再開する':'5分はじめる');
  b.onclick=()=>timer?stop():start();a.appendChild(b);
  const s=document.createElement('button');s.className='btn sec';
  s.textContent='もうやった（記録だけつける）';
  s.onclick=()=>{stop();left=SESSION;markDone();paintTimer();};
  a.appendChild(s);
}

function render(){
  const v=peek===null?state.vitality:peek;
  let L=LEVELS[0];for(const l of LEVELS)if(v>=l.min)L=l;
  document.documentElement.style.setProperty('--h',L.h);
  document.documentElement.style.setProperty('--s',L.s);
  document.getElementById('avatar').setAttribute('class','avatar lv'+L.lv);
  document.getElementById('levelName').textContent=L.name;
  document.getElementById('speech').textContent=L.say;
  document.getElementById('bar').style.width=v+'%';
  document.getElementById('vitalNum').innerHTML=v+'<small>/100</small>';

  const f=document.getElementById('forecast');
  if(v<20){f.textContent='これ以上は落ちない。ここから戻すしかない。';f.className='forecast warn';}
  else{const d=Math.ceil((v-19)/DECAY);
    f.textContent=`このまま手を止めれば、${d}日でボロボロになる。`;
    f.className='forecast'+(d<=2?' warn':'');}

  const t=today();
  document.getElementById('goal').value=state.goal;
  document.getElementById('dateLabel').textContent=
    `${t.getMonth()+1}月${t.getDate()}日 ・ ${isDone(t)?'今日は達成ずみ':'今日はまだ手つかず'}`;

  const st=streak();state.best=Math.max(state.best,st);
  document.getElementById('streak').textContent=st;
  document.getElementById('best').textContent=state.best;
  document.getElementById('total').textContent=state.done.length;

  const cells=document.getElementById('cells');cells.innerHTML='';
  const end=shift(t,6-t.getDay());
  for(let i=34;i>=0;i--){
    const d=shift(end,-i),el=document.createElement('i');
    if(isDone(d))el.className='on';
    if(key(d)===key(t))el.className+=' today';
    if(d>t)el.style.opacity='.35';
    el.title=key(d);cells.appendChild(el);
  }
  renderActs();paintTimer();
}

document.getElementById('goal').addEventListener('input',e=>{state.goal=e.target.value;save();});
document.getElementById('nextDay').onclick=()=>{state.dayOffset+=1;stop();left=SESSION;peek=null;rollover();
  document.getElementById('peek').value=state.vitality;render();save();};
document.getElementById('reset').onclick=()=>{
  state={vitality:62,goal:'資格の勉強',lastDate:key(new Date()),dayOffset:0,done:[],best:0};
  stop();left=SESSION;peek=null;document.getElementById('peek').value=62;render();save();};
document.getElementById('peek').addEventListener('input',e=>{peek=Number(e.target.value);render();});

(async()=>{await load();rollover();document.getElementById('peek').value=state.vitality;render();save();})();
</script>
